[mypy]
# Global settings
python_version = 3.10
warn_return_any = True
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
show_error_codes = True
show_column_numbers = True
pretty = True

# Strict mode (gradually enable)
strict_optional = True
no_implicit_optional = True
check_untyped_defs = True

# Ignore missing imports for third-party libraries without stubs
ignore_missing_imports = True

# 检查范围：生产代码入口 + 三个交付/内核包 + 组合根。
# 裸 `mypy` 等价于 `mypy bot src web composition main.py app.py`。
files = bot, src, web, composition, main.py, app.py

# 排除范围：AI 工具产物目录、测试、仓库根的一次性脚本。
# 这些目录/文件从未被类型检查过，且 tests/archived/test_fixes.py 与根 test_fixes.py
# 模块重名会让 `mypy .` 直接以退出码 2 中止（CI 的类型检查步骤因此长期空转）。
# 测试整体排除：原 [mypy-tests.*] ignore_errors 段因 tests/__init__.py 不存在而从未匹配上
# （warn_unused_configs 会报 unused section）；这里用 exclude 表达同一意图，
# 而不是新建 tests/__init__.py —— 后者会改变 pytest 对整个用例树的模块命名，风险不对等。
exclude = (?x)(
    ^\.[^/]+/
    |^(build|node_modules|docs|backups|downloads|data|tmp|static|templates)/
    |^tests/
    |^scripts/oneoff/
    |^(test|fix|diagnose|verify|cleanup|check|debug|batch|sync)_.*\.py$
    )

# Per-module settings
[mypy-bot.*]
# Enable stricter checks for bot module
disallow_untyped_defs = False
disallow_incomplete_defs = False

[mypy-web.*]
# Web module settings
disallow_untyped_defs = False

[mypy-database]
# Database module - stricter checks
disallow_untyped_defs = False
warn_return_any = True

[mypy-config]
# Config module
disallow_untyped_defs = False
